version: 2
updates:
  # Points at the pnpm workspace root, not /framework directly, even
  # though framework is the only real dependency-bearing package (root
  # has none of its own, examples/ isn't tracked here). The shared
  # pnpm-lock.yaml lives at the workspace root; pointing this at
  # /framework instead made Dependabot bump framework/package.json
  # without updating the lockfile, which every "Verify framework" CI
  # run then rejected as an out-of-date lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
